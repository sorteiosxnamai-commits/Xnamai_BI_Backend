services:
  - type: web
    name: xnamai-bi-backend
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MERCOS_ADAPTOR_URL
        sync: false
      - key: MERCOS_ADAPTOR_API_KEY
        sync: false
      - key: BI_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

